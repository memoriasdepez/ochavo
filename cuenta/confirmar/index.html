<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fffdf6">
  <title>Tu cuenta · Ochavo</title>
</head>
<body>
  <div class="oa-shell">
    <a class="oa-brand" href="/" aria-label="Volver a Ochavo"><span class="oa-brand-mark" aria-hidden="true">o</span>Ochavo<span class="oa-brand-dot" aria-hidden="true">.</span></a>
    <main class="oa-card" id="email-action" aria-labelledby="action-title">
      <div class="oa-illustration" aria-hidden="true">
        <span class="oa-spark oa-spark--left">✦</span>
        <div class="br-mascot"><div class="br-leaf"></div><div class="br-leaf other"></div><div class="br-seed"><span class="br-mouth"></span></div></div>
        <span class="oa-spark oa-spark--right">✦</span>
      </div>
      <p class="oa-eyebrow">TU CUENTA, LISTA PARA APRENDER</p>
      <h1 id="action-title" aria-describedby="action-description" tabindex="-1">Estamos comprobando tu enlace</h1>
      <p id="action-description">Solo tardará un momento.</p>
      <div id="action-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="action-controls"></div>
      <noscript><p>Activa JavaScript para confirmar tu correo o cambiar tu contraseña de forma segura.</p><a class="oa-button" href="/">Volver a Ochavo</a></noscript>
    </main>
    <p class="oa-footer">Aprende a invertir, paso a paso.</p>
  </div>
  <script type="module" src="/src/email-action.js"></script>
</body>
</html>
